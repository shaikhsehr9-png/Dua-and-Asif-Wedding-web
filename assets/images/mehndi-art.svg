<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="mGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECC880"/>
      <stop offset="50%" stop-color="#B38A50"/>
      <stop offset="100%" stop-color="#6F491A"/>
    </linearGradient>
  </defs>
  <!-- Mehndi / Henna Mandala Motif -->
  <g transform="translate(80, 80)" stroke="url(#mGold)" fill="none" stroke-linecap="round">
    <circle cx="0" cy="0" r="14" fill="#6F2638" stroke="url(#mGold)" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="6" fill="#ECC880"/>
    
    <!-- 8 Inner Petals -->
    <path d="M 0,-14 C -6,-24 6,-24 0,-14 Z" fill="#421522" stroke-width="1.2"/>
    <path d="M 0,14 C -6,24 6,24 0,14 Z" fill="#421522" stroke-width="1.2"/>
    <path d="M -14,0 C -24,-6 -24,6 -14,0 Z" fill="#421522" stroke-width="1.2"/>
    <path d="M 14,0 C 24,-6 24,6 14,0 Z" fill="#421522" stroke-width="1.2"/>
    <path d="M -10,-10 C -18,-18 -14,-22 -10,-10 Z" fill="#421522" stroke-width="1.2"/>
    <path d="M 10,-10 C 18,-18 22,-14 10,-10 Z" fill="#421522" stroke-width="1.2"/>
    <path d="M -10,10 C -18,18 -22,14 -10,10 Z" fill="#421522" stroke-width="1.2"/>
    <path d="M 10,10 C 18,18 14,22 10,10 Z" fill="#421522" stroke-width="1.2"/>

    <!-- Concentric Henna Rings & Scallops -->
    <circle cx="0" cy="0" r="32" stroke-width="1.2" stroke-dasharray="2,3"/>
    <circle cx="0" cy="0" r="44" stroke-width="1.5"/>

    <!-- Outer Paisley / Henna Floral Tips -->
    <path d="M 0,-44 C -12,-62 0,-72 6,-68 C 12,-64 0,-52 0,-44 Z" fill="#B38A50" opacity="0.85"/>
    <path d="M 0,44 C 12,62 0,72 -6,68 C -12,64 0,52 0,44 Z" fill="#B38A50" opacity="0.85"/>
    <path d="M -44,0 C -62,12 -72,0 -68,-6 C -64,-12 -52,0 -44,0 Z" fill="#B38A50" opacity="0.85"/>
    <path d="M 44,0 C 62,-12 72,0 68,6 C 64,12 52,0 44,0 Z" fill="#B38A50" opacity="0.85"/>

    <!-- Henna Dot Flourishes -->
    <circle cx="0" cy="-52" r="2.5" fill="#ECC880"/>
    <circle cx="0" cy="52" r="2.5" fill="#ECC880"/>
    <circle cx="-52" cy="0" r="2.5" fill="#ECC880"/>
    <circle cx="52" cy="0" r="2.5" fill="#ECC880"/>
  </g>
</svg>